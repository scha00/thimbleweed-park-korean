name: Build ngpack binaries

on:
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: ngpack-windows
            outfile: ngpack.exe
          - os: ubuntu-latest
            artifact: ngpack-linux
            outfile: ngpack
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout ngpack source
        uses: actions/checkout@v4
        with:
          repository: scemino/ngpack
          path: ngpack-src

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1

      - name: Relax sdk constraint for modern Dart
        shell: bash
        run: |
          sed -i.bak "s/sdk: '>=2.12.0 <3.0.0'/sdk: '>=2.12.0 <4.0.0'/" ngpack-src/pubspec.yaml
          cat ngpack-src/pubspec.yaml

      - name: Get dependencies
        working-directory: ngpack-src
        run: dart pub get

      - name: Compile executable
        working-directory: ngpack-src
        run: dart compile exe bin/ngpack.dart -o ${{ matrix.outfile }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ngpack-src/${{ matrix.outfile }}
