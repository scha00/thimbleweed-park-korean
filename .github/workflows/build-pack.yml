name: Rebuild ThimbleweedPark.ggpack4

on:
  push:
    branches: [main]
    paths:
      - "patch/**"
      - "tools/**"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1

      - name: Install dependencies
        working-directory: tools
        run: dart pub get

      - name: Build ThimbleweedPark.ggpack4
        working-directory: tools
        run: dart run bin/build_pack.dart ../patch ../install/ThimbleweedPark.ggpack4

      - name: Commit if changed
        run: |
          if git diff --quiet -- install/ThimbleweedPark.ggpack4; then
            echo "No changes to install/ThimbleweedPark.ggpack4"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add install/ThimbleweedPark.ggpack4
          git commit -m "Rebuild ThimbleweedPark.ggpack4 from patch/ [skip ci]"
          git push
